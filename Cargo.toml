[package]
name = "tinyhand-rs"
version = "0.2.1"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "TinyHand presentation pointer for X11 Linux"

[dependencies]
gtk = { version = "0.18.2", features = ["v3_24"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = true
codegen-units = 1

